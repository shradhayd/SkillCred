<nav class="navbar">
  <div class="navbar-inner">
    <a routerLink="/home" class="logo">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">SkillCred</span>
    </a>

    <div class="nav-links">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/browse-skills" routerLinkActive="active">Browse Skills</a>
      <a routerLink="/how-it-works" routerLinkActive="active">How It Works</a>
      @if (isLoggedIn) {
        <a routerLink="/wallet" routerLinkActive="active">Wallet</a>
      }
    </div>

    <div class="nav-actions">
      @if (!isLoggedIn) {
        <a routerLink="/login" mat-stroked-button class="btn-login">Login</a>
        <a routerLink="/signup" mat-flat-button class="btn-primary">Sign Up</a>
      } @else {
        <button mat-icon-button [matMenuTriggerFor]="notifMenu" class="notif-btn">
          <mat-icon [matBadge]="unreadCount" matBadgeColor="warn" [matBadgeHidden]="unreadCount === 0">notifications</mat-icon>
        </button>
        <mat-menu #notifMenu="matMenu" class="notif-menu">
          @for (notif of notifications; track notif.id) {
            <button mat-menu-item class="notif-item" [class.unread]="!notif.read">
              <div class="notif-content">
                <strong>{{ notif.title }}</strong>
                <span>{{ notif.message }}</span>
                <small>{{ notif.time }}</small>
              </div>
            </button>
          }
        </mat-menu>

        <button mat-icon-button [matMenuTriggerFor]="profileMenu" class="avatar-btn">
          <img src="https://i.pravatar.cc/150?u=shradha" alt="Profile" class="avatar" />
        </button>
        <mat-menu #profileMenu="matMenu">
          <button mat-menu-item routerLink="/my-profile">
            <mat-icon>person</mat-icon> My Profile
          </button>
          <button mat-menu-item routerLink="/wallet">
            <mat-icon>account_balance_wallet</mat-icon> Wallet
          </button>
          <button mat-menu-item routerLink="/session-history">
            <mat-icon>history</mat-icon> Session History
          </button>
          <button mat-menu-item routerLink="/settings">
            <mat-icon>settings</mat-icon> Settings
          </button>
          @if (isAdmin) {
            <button mat-menu-item routerLink="/admin">
              <mat-icon>admin_panel_settings</mat-icon> Admin Panel
            </button>
          }
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon> Logout
          </button>
        </mat-menu>
      }
    </div>
  </div>
</nav>
