<app-navbar [isLoggedIn]="false" />

<div class="auth-page">
  <div class="auth-card card">
    <h1>Join SkillCred</h1>
    <p class="auth-sub">Create your account and start exchanging skills</p>

    @if (error) {
      <div class="error-msg">{{ error }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Full Name</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirm Password</mat-label>
        <input matInput formControlName="confirmPassword" type="password" />
      </mat-form-field>
            <button mat-flat-button class="btn-primary full-width submit-btn" type="submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Creating account...' : 'Sign Up' }}
      </button>
    </form>
        <div class="or-divider"><span>or</span></div>
    <button mat-stroked-button type="button" class="google-btn full-width" (click)="googleLogin()" [disabled]="loading">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" width="18" height="18" />
      Continue with Google
    </button>

    <p class="auth-footer">
      Already have an account? <a routerLink="/login">Login</a>
    </p>
  </div>
</div>

<app-footer />
