<app-navbar [isLoggedIn]="false" />

<div class="auth-page">
  <div class="auth-card card">
    <h1>Welcome Back</h1>
    <p class="auth-sub">Sign in to your SkillCred account</p>

    @if (error) {
      <div class="error-msg">{{ error }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" />
      </mat-form-field>
      <button mat-flat-button class="btn-primary full-width submit-btn" type="submit" [disabled]="form.invalid">
        Login
      </button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a routerLink="/signup">Sign Up</a>
    </p>
    <p class="demo-hint">Demo: shradha@gmail.com / shradha1234</p>
  </div>
</div>

<app-footer />
